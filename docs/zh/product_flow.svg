<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1188" width="1180" height="1188" font-family="system-ui, -apple-system, Segoe UI, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6f6c"/></marker></defs>
<rect width="1180" height="1188" fill="white"/>
<rect x="20" y="68" width="1140" height="92" rx="8" fill="#f9f9f7" stroke="#d8dcd9"/>
<text x="34" y="98" fill="#1c1c1a" font-weight="700" font-size="15">试用</text>
<text x="34" y="118" fill="#6b6f6c" font-size="10.5">1 分钟,不装任何东西</text>
<rect x="20" y="188" width="1140" height="404" rx="8" fill="#f9f9f7" stroke="#d8dcd9"/>
<text x="34" y="218" fill="#1c1c1a" font-weight="700" font-size="15">建立</text>
<text x="34" y="238" fill="#6b6f6c" font-size="10.5">约 20 分钟,只做一次</text>
<rect x="20" y="620" width="1140" height="358" rx="8" fill="#f9f9f7" stroke="#d8dcd9"/>
<text x="34" y="650" fill="#1c1c1a" font-weight="700" font-size="15">每月</text>
<text x="34" y="670" fill="#6b6f6c" font-size="10.5">导入日,默认 26 号</text>
<rect x="20" y="1006" width="1140" height="170" rx="8" fill="#f9f9f7" stroke="#d8dcd9"/>
<text x="34" y="1036" fill="#1c1c1a" font-weight="700" font-size="15">随时</text>
<text x="34" y="1056" fill="#6b6f6c" font-size="10.5">每周、每季、工具更新</text>
<text x="34" y="1071" fill="#6b6f6c" font-size="10.5">时</text>
<text x="320.0" y="44" text-anchor="middle" fill="#1c1c1a" font-weight="700" font-size="11" letter-spacing=".08em">你</text>
<text x="650.0" y="44" text-anchor="middle" fill="#4a3aa7" font-weight="700" font-size="11" letter-spacing=".08em">JADE TOAD</text>
<text x="980.0" y="44" text-anchor="middle" fill="#2a78d6" font-weight="700" font-size="11" letter-spacing=".08em">页面</text>
<path d="M470,114 L830,114" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M980,142 L980,234 L470,234" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="662" y="226" width="126" height="16" rx="3" fill="white"/>
<text x="725" y="238" text-anchor="middle" fill="#6b6f6c" font-size="10.5">觉得值得,就做成自己的</text>
<path d="M320,262 L320,292" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M470,312 L500,312" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M650,340 L650,390 L470,390" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="511" y="382" width="98" height="16" rx="3" fill="white"/>
<text x="560" y="394" text-anchor="middle" fill="#6b6f6c" font-size="10.5">草稿按表格给你看</text>
<path d="M320,418 L320,468 L500,468" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M650,496 L650,546 L830,546" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M980,574 L980,705 L380,705 L380,732" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="532" y="697" width="296" height="16" rx="3" fill="white"/>
<text x="680" y="708" text-anchor="middle" fill="#6b6f6c" font-size="10.5">同一批文件就是第一次导入:直接说「update dashboards」</text>
<path d="M500,666 L470,666" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,4"/>
<path d="M320,686 L320,732" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M470,752 L500,752" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M650,788 L650,846 L830,846" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M830,846 L470,846" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M320,874 L320,932 L500,932" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="388" y="924" width="43" height="16" rx="3" fill="white"/>
<text x="410" y="936" text-anchor="middle" fill="#6b6f6c" font-size="10.5">一句话</text>
<path d="M650,960 L650,974 L154,974 L154,666 L170,666" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5,4"/>
<rect x="380" y="966" width="43" height="16" rx="3" fill="white"/>
<text x="402" y="978" text-anchor="middle" fill="#6b6f6c" font-size="10.5">下个月</text>
<path d="M980,882 L980,1024" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M830,1052 L470,1052" fill="none" stroke="#6b6f6c" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="170" y="86" width="300" height="56" rx="9" fill="#fcfcfb" stroke="#1c1c1a" stroke-width="2"/>
<text x="184" y="110" fill="#1c1c1a">克隆仓库,双击打开</text>
<text x="184" y="126" fill="#1c1c1a">dashboards/finance_dashboard.html。</text>
<rect x="830" y="86" width="300" height="56" rx="9" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<text x="844" y="110" fill="#1c1c1a">Emma Roy 的一年:19 页,全部合成数据,余额链照</text>
<text x="844" y="126" fill="#1c1c1a">样闭合。</text>
<rect x="170" y="206" width="300" height="56" rx="9" fill="#fcfcfb" stroke="#1c1c1a" stroke-width="2"/>
<text x="184" y="230" fill="#1c1c1a">把上个月的文件丢进 inbox/:银行对账单、券商的</text>
<text x="184" y="246" fill="#1c1c1a">持仓和活动导出、海外账户截图。文件名不改。</text>
<rect x="170" y="292" width="300" height="40" rx="9" fill="#fcfcfb" stroke="#1c1c1a" stroke-width="2"/>
<text x="184" y="316" fill="#1c1c1a">说「set this up」。</text>
<rect x="500" y="284" width="300" height="56" rx="9" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="2"/>
<text x="514" y="308" fill="#1c1c1a">逐份读文件,起草账户表、每月文件表和第一版计</text>
<text x="514" y="324" fill="#1c1c1a">划;列出文件答不了的问题。</text>
<rect x="170" y="362" width="300" height="56" rx="9" fill="#fcfcfb" stroke="#1c1c1a" stroke-width="2"/>
<text x="184" y="386" fill="#1c1c1a">对着表格改错处,回答约 12 个问题:显示的名字、</text>
<text x="184" y="402" fill="#1c1c1a">出生年、日常额度、投资桶、海外资产……</text>
<rect x="500" y="440" width="300" height="56" rx="9" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="2"/>
<text x="514" y="464" fill="#1c1c1a">问题没清零就拒绝写入。清零后生成</text>
<text x="514" y="480" fill="#1c1c1a">findata/register/,账本留空,重建页面。</text>
<rect x="830" y="518" width="300" height="56" rx="9" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<text x="844" y="542" fill="#1c1c1a">名字、账户、计划已就位;历史为空,每一页都说明</text>
<text x="844" y="558" fill="#1c1c1a">「还没有导入」,而不是显得坏了。</text>
<rect x="500" y="638" width="300" height="56" rx="9" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="2" stroke-dasharray="6,4"/>
<text x="514" y="662" fill="#1c1c1a">导入日早上提醒:哪些文件到了,哪些还缺。只读不</text>
<text x="514" y="678" fill="#1c1c1a">写。</text>
<rect x="170" y="646" width="300" height="40" rx="9" fill="#fcfcfb" stroke="#1c1c1a" stroke-width="2"/>
<text x="184" y="670" fill="#1c1c1a">从各银行下载本月对账单和导出,丢进 inbox/。</text>
<rect x="170" y="732" width="300" height="40" rx="9" fill="#fcfcfb" stroke="#1c1c1a" stroke-width="2"/>
<text x="184" y="756" fill="#1c1c1a">说「update dashboards」。</text>
<rect x="500" y="716" width="300" height="72" rx="9" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="2"/>
<text x="514" y="740" fill="#1c1c1a">一条本地命令做完:认出每份文件、按内容查重 →</text>
<text x="514" y="756" fill="#1c1c1a">解析器逐份读,对平了才写 → 商户分类 → 写数据</text>
<text x="514" y="772" fill="#1c1c1a">→ 重建页面 → 归档原件。模型只看摘要。</text>
<rect x="830" y="810" width="300" height="72" rx="9" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<text x="844" y="834" fill="#1c1c1a">Records → Updates 就是报告:变了什么 · 问你什</text>
<text x="844" y="850" fill="#1c1c1a">么 · 注意到什么 · 替你决定了什么 · 收到哪些</text>
<text x="844" y="866" fill="#1c1c1a">文件。页头一句话:数据到哪、缺什么、几项待答。</text>
<rect x="170" y="818" width="300" height="56" rx="9" fill="#fcfcfb" stroke="#1c1c1a" stroke-width="2"/>
<text x="184" y="842" fill="#1c1c1a">读报告;回答待确认项:新商户、没有署名的</text>
<text x="184" y="858" fill="#1c1c1a">e-Transfer、解析器读不了的文件。</text>
<rect x="500" y="904" width="300" height="56" rx="9" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="2"/>
<text x="514" y="928" fill="#1c1c1a">一句话即归档:答案写回商户表和账本的类型列,页</text>
<text x="514" y="944" fill="#1c1c1a">面重建。</text>
<rect x="170" y="1024" width="300" height="56" rx="9" fill="#fcfcfb" stroke="#1c1c1a" stroke-width="2"/>
<text x="184" y="1048" fill="#1c1c1a">每周看 This month:额度还剩多少。每季过一遍</text>
<text x="184" y="1064" fill="#1c1c1a">Investing → Rules 和 Checkpoints。</text>
<rect x="830" y="1024" width="300" height="56" rx="9" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<text x="844" y="1048" fill="#1c1c1a">侧边栏圆点:琥珀 = 看一眼,红 = 规则被破。四个</text>
<text x="844" y="1064" fill="#1c1c1a">检查器过不去,页面根本建不出来。</text>
<rect x="500" y="1102" width="300" height="56" rx="9" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="2" stroke-dasharray="6,4"/>
<text x="514" y="1126" fill="#1c1c1a">工具更新时:sync.py 推入技能和模板,migrate.py</text>
<text x="514" y="1142" fill="#1c1c1a">把数据形状逐步升级;你的数据一个字节不碰。</text>
</svg>
