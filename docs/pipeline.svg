<text x="666.0" y="330" text-anchor="middle" fill="#1c1c1a">each statement, reconcile</text>
<text x="666.0" y="346" text-anchor="middle" fill="#1c1c1a">it</text>
<text x="666.0" y="360" text-anchor="middle" fill="#1c1c1a">(documents[].reconcile),</text>
<text x="666.0" y="376" text-anchor="middle" fill="#1c1c1a">categorise via</text>
<text x="666.0" y="390" text-anchor="middle" fill="#1c1c1a">merchants.json</text>
