<text x="1266.0" y="63" text-anchor="middle" fill="#1c1c1a">Claude reads the summary —</text>
<text x="1266.0" y="78" text-anchor="middle" fill="#1c1c1a">never the rows — and asks</text>
<text x="1266.0" y="93" text-anchor="middle" fill="#1c1c1a">you only what a program</text>
<text x="1266.0" y="108" text-anchor="middle" fill="#1c1c1a">cannot decide; the report</text>
<text x="1266.0" y="123" text-anchor="middle" fill="#1c1c1a">is the record read out</text>
<rect x="175" y="181" width="182" height="76" rx="9" fill="#fcfcfb" stroke="#6b6f6c" stroke-width="2" stroke-dasharray="6,4"/>
<text x="266.0" y="208" text-anchor="middle" fill="#1c1c1a">Scheduled task · 26th</text>
