<text x="266.0" y="108" text-anchor="middle" fill="#1c1c1a">exports into inbox/</text>
<rect x="375" y="51" width="182" height="76" rx="9" fill="#fcfcfb" stroke="#1c1c1a" stroke-width="2"/>
<text x="466.0" y="93" text-anchor="middle" fill="#1c1c1a">Say “update dashboards”</text>
