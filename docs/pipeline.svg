<text x="866.0" y="346" text-anchor="middle" fill="#1c1c1a">ledgers, spending.csv,</text>
<text x="866.0" y="360" text-anchor="middle" fill="#1c1c1a">banks.json and the</text>
<text x="866.0" y="376" text-anchor="middle" fill="#1c1c1a">registry copies</text>
<rect x="975" y="311" width="182" height="76" rx="9" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="2"/>
<text x="1066.0" y="338" text-anchor="middle" fill="#1c1c1a">Step 4 · rebuild.py — 44</text>
<text x="1066.0" y="353" text-anchor="middle" fill="#1c1c1a">dashboard constants</text>
<text x="1066.0" y="368" text-anchor="middle" fill="#1c1c1a">recomputed from findata/</text>
<rect x="1175" y="311" width="182" height="76" rx="9" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="2"/>
<text x="1266.0" y="338" text-anchor="middle" fill="#1c1c1a">Steps 6–7 · archives as</text>
