<text x="466.0" y="200" text-anchor="middle" fill="#1c1c1a">preflight.py — names every</text>
<text x="466.0" y="216" text-anchor="middle" fill="#1c1c1a">inbox file, hashes inbox/</text>
<text x="466.0" y="230" text-anchor="middle" fill="#1c1c1a">+ findata/, flags anything</text>
<text x="466.0" y="246" text-anchor="middle" fill="#1c1c1a">over 30 days</text>
<rect x="775" y="181" width="182" height="76" rx="9" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" stroke-dasharray="6,4"/>
<text x="866.0" y="208" text-anchor="middle" fill="#1c1c1a">--verify before every</text>
<text x="866.0" y="223" text-anchor="middle" fill="#1c1c1a">write · --reseed after</text>
<text x="866.0" y="238" text-anchor="middle" fill="#1c1c1a">your own</text>
<rect x="575" y="311" width="182" height="76" rx="9" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="2"/>
